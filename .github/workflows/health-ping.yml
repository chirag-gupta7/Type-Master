name: Backend Health Ping

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -fsS -o /dev/null -w "health: %{http_code}\n" https://typemaster-backend-pfns.onrender.com/health
